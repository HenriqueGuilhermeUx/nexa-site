name: Apply incomplete-user controls

on:
  push:
    branches:
      - agent/delete-incomplete-users
    paths:
      - .github/workflows/apply-incomplete-user-controls.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/delete-incomplete-users
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Control Center
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, oldText, newText, label) {
            const source = fs.readFileSync(path, 'utf8');
            if (source.includes(newText)) return;
            if (!source.includes(oldText)) {
              throw new Error(`Anchor not found for ${label}`);
            }
            fs.writeFileSync(path, source.replace(oldText, newText));
          }

          const path = 'admin.js';
          replaceOnce(
            path,
            `function renderClientes() {
              const rows = filteredClients();`,
            `function canDeleteIncompleteClient(client) {
              const kycStatus = String(client?.kycStatus || '').toLowerCase();
              return Boolean(
                client &&
                  kycStatus !== 'approved' &&
                  ledgerUsdc(client) === 0 &&
                  !client.walletAddress &&
                  !client.privyUserId &&
                  !client.privyWalletId,
              );
            }

            function renderClientes() {
              const rows = filteredClients();`,
            'delete eligibility helper',
          );

          replaceOnce(
            path,
            `        const deleteButton = user.isTestOrAdmin
                      ? \`<button class="small-btn red" onclick="deleteTestClient('\${user.id}')">Excluir teste</button>\`
                      : '';`,
            `        const canDelete =
                      user.isTestOrAdmin || canDeleteIncompleteClient(user);
                    const deleteButton = canDelete
                      ? \`<button class="small-btn red" onclick="deleteIncompleteClient('\${user.id}')">\${
                          user.isTestOrAdmin ? 'Excluir teste' : 'Excluir incompleto'
                        }</button>\`
                      : '';`,
            'delete action button',
          );

          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('async function deleteIncompleteClient(id)')) {
            const start = source.indexOf('async function deleteTestClient(id)');
            const end = source.indexOf('async function report(id)', start);
            if (start < 0 || end < 0) {
              throw new Error('Delete handler anchors not found');
            }
            const handler = `async function deleteIncompleteClient(id) {
              const client = clientById(id);
              const canDelete =
                client.isTestOrAdmin || canDeleteIncompleteClient(client);
              if (!canDelete) {
                return toast(
                  'Exclusão definitiva só é permitida para cadastro incompleto e vazio. Use Arquivar para os demais clientes.',
                  true,
                );
              }

              const reason =
                prompt(
                  'Motivo obrigatório da exclusão:',
                  client.isTestOrAdmin
                    ? 'Conta criada exclusivamente para QA'
                    : 'Cadastro incompleto sem KYC, carteira ou histórico financeiro',
                ) || '';
              if (!reason.trim()) return;

              const confirmEmail =
                prompt('Digite exatamente o e-mail da conta para confirmar:', '') || '';
              if (
                confirmEmail.trim().toLowerCase() !==
                String(client.email || '').toLowerCase()
              ) {
                return toast('O e-mail de confirmação não corresponde.', true);
              }

              const label = client.isTestOrAdmin
                ? 'esta conta de teste vazia'
                : 'este cadastro incompleto';
              if (!confirm(\`Excluir definitivamente \${label}?\`)) return;

              try {
                await call(\`/admin/users/\${encodeURIComponent(id)}\`, {
                  method: 'DELETE',
                  body: JSON.stringify({ reason, confirmEmail }),
                });
                toast(
                  client.isTestOrAdmin
                    ? 'Conta de teste excluída'
                    : 'Cadastro incompleto excluído',
                );
                await refresh();
              } catch (error) {
                toast(error.message, true);
              }
            }

            `;
            source = source.slice(0, start) + handler + source.slice(end);
            fs.writeFileSync(path, source);
          }

          replaceOnce(
            '.github/workflows/site-ci.yml',
            `      - name: Validate launch strategy and financial safety
                run: node scripts/validate-launch-site.js
              - name: Validate required pages`,
            `      - name: Validate launch strategy and financial safety
                run: node scripts/validate-launch-site.js
              - name: Validate incomplete-user controls
                run: node scripts/validate-incomplete-user-controls.js
              - name: Validate required pages`,
            'site CI validation',
          );
          NODE

      - name: Validate patched Control Center
        run: |
          node --check admin.js
          node scripts/validate-incomplete-user-controls.js

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js .github/workflows/site-ci.yml
          if git diff --cached --quiet; then
            echo "No source changes required"
          else
            git commit -m "Allow safe deletion of incomplete user registrations"
            git push origin HEAD:agent/delete-incomplete-users
          fi
