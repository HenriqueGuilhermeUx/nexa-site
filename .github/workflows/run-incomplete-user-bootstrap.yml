name: Run one-time incomplete-user bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-incomplete-user-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/delete-incomplete-users
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract branch patch command
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-incomplete-user-controls.yml').read_text()
          marker = '      - name: Patch Control Center\n'
          start = source.index(marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('\n      - name: Validate patched Control Center', run)
          lines = source[run:end].splitlines()
          Path('/tmp/apply-site-fix.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          bash /tmp/apply-site-fix.sh

      - name: Validate patch
        run: |
          node --check admin.js
          node scripts/validate-incomplete-user-controls.js

      - name: Commit target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js .github/workflows/site-ci.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Allow safe deletion of incomplete user registrations"
            git push origin HEAD:agent/delete-incomplete-users
          fi
