name: Nexa Site CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Validate JavaScript syntax
        run: |
          node --check admin.js
          node --check admin-kyc.js
          node --check scripts/build-site.mjs
      - name: Validate launch strategy and financial safety
        run: node scripts/validate-launch-site.js
      - name: Validate Nexa unified brand and preserved Wallet routes
        run: node scripts/validate-unified-nexa.mjs
      - name: Validate custom Wallet domain preflight script (no network)
        run: node scripts/check-wallet-domain.mjs
      - name: Verify original Wallet SW never caches future Nexa Life OS path
        run: node scripts/smoke-wallet-sw-lifeos-namespace.mjs
      - name: Validate Privy domain readiness probe (local only, no network)
        run: |
          node --test scripts/smoke-privy-origin.mjs
          node scripts/check-privy-origin.mjs
      - name: Verify Agentics beta page is static, honest and does not collect data
        run: node scripts/validate-agentics-beta.mjs
      - name: Verify commercial Agentics and Trust pages are static and accurately scoped
        run: node scripts/validate-agentics-commercial.mjs
      - name: Validate required pages
        run: |
          test -s index.html
          test -s primeiros-nexa.html
          test -s pj.html
          test -s merchant.html
          test -s admin.html
          test -s kyc-done.html
          test -s netlify.toml
      - name: Build validated Privy portal under site path
        run: node scripts/build-site.mjs
      - name: Verify embedded portal output
        run: |
          test -s portal/index.html
          test -d portal/assets
          grep -q 'src="/portal/assets/' portal/index.html
          grep -q 'href="/portal/assets/' portal/index.html
          grep -R -q '/payment/user' portal/assets
          grep -R -q 'direct-settlement/wallet/link' portal/assets
          grep -R -q 'x-privy-access-token' portal/assets
          ! grep -R -E 'PRIVY_APP_SECRET|PRIVY_SECRET_KEY|MASTER_WALLET_PRIVATE_KEY|/user/link-privy-wallet' portal
