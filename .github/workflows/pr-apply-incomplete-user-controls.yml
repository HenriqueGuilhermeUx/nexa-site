name: PR apply incomplete-user controls

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/delete-incomplete-users
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply branch patch
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-incomplete-user-controls.yml').read_text()
          start = source.index('      - name: Patch Control Center\n')
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('\n      - name: Validate patched Control Center', run)
          lines = source[run:end].splitlines()
          Path('/tmp/apply.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          bash /tmp/apply.sh
          node --check admin.js
          node scripts/validate-incomplete-user-controls.js
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js .github/workflows/site-ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "Allow safe deletion of incomplete user registrations"
            git push origin HEAD:agent/delete-incomplete-users
          fi
