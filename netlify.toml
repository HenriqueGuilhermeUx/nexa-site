[build]
  publish = "."
  command = "node scripts/build-site.mjs"

[build.environment]
  NODE_VERSION = "20.19.4"
  NPM_FLAGS = "--no-audit --no-fund"
  NEXA_PORTAL_COMMIT = "2621945c47805c5f62c910ddefb627078200fa5c"
  NEXA_GLOBAL_APP_COMMIT = "a930c2438691e3b2026fa0a5a5e9a9b9d8ec1499"
  VITE_API_URL = "https://nexa-backend-p2u0.onrender.com/api/v1"
  VITE_PRIVY_APP_ID = "cmpen2gm3007v0cjswjlyefji"
  VITE_PRIVY_CLIENT_ID = "client-WY6ZY2Ptr39FTjXumMRAfqM2Bx8m9DUWxcSgXg6CWaMyT"

# Public onboarding gateway, not the app auth itself.
# Restricted Nexa Life OS preview remains isolated and invitation-only.
[[redirects]]
  from = "/meu-espaco"
  to = "/meu-espaco.html"
  status = 200
  force = true

# Existing wallet landing preserved at /wallet without redirecting clients.
# This is a READ-ONLY landing-page routing rule; the existing /portal/ SPA,
# API proxy, customer sessions, backend and existing deep links are untouched.
[[redirects]]
  from = "/wallet"
  to = "/wallet.html"
  status = 200
  force = true

# TEMPORARY AUTH SAFETY GATE — Privy iframe rejects wallet.trynexa.com.br
# with 403/CSP until that origin is approved on the EXISTING Privy app.
# Wallet home / and marketing /wallet remain on wallet.trynexa.com.br,
# but legacy login, compiled React portal and signup go to trusted old origin.
# No permanent 301, cookies or sessions are transferred. Reassess only after
# same-user/same-wallet Privy E2E; preserve old entry points on rollback.
[[redirects]]
  from = "https://wallet.trynexa.com.br/portal"
  to = "https://trynexa.com.br/portal"
  status = 302
  force = true

[[redirects]]
  from = "https://wallet.trynexa.com.br/portal/*"
  to = "https://trynexa.com.br/portal/:splat"
  status = 302
  force = true

[[redirects]]
  from = "https://wallet.trynexa.com.br/cadastro"
  to = "https://trynexa.com.br/cadastro"
  status = 302
  force = true

[[redirects]]
  from = "https://wallet.trynexa.com.br/wallet-v148.html"
  to = "https://trynexa.com.br/wallet-v148.html"
  status = 302
  force = true

# Wallet-only marketing landing (Netlify domain alias already configured).
[[redirects]]
  from = "https://wallet.trynexa.com.br/"
  to = "/wallet.html"
  status = 200
  force = true

# Nexa Global PWA. Static assets shadow this SPA fallback.
[[redirects]]
  from = "/global-app/*"
  to = "/global-app/index.html"
  status = 200

# Existing Nexa Wallet PWA: keep manifest id, start_url and scope unchanged.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/global-app/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/global-app/"

[[headers]]
  for = "/global-app/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

# Nexa Global domain alias. These rules become active only after
# global.trynexa.com.br is assigned to this Netlify site.
[[redirects]]
