<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexa Checkout | Gere uma cobrança em segundos</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{background:#020617;color:#fff;font-family:Inter,system-ui,sans-serif}.glass{background:rgba(15,23,42,.86);border:1px solid rgba(148,163,184,.18)}input,select{background:#020617;border:1px solid #334155;color:#fff}</style></head><body><nav class="border-b border-white/10 p-5"><div class="max-w-5xl mx-auto flex justify-between"><a href="/" class="font-black text-xl">Nexa Checkout</a><a href="/merchant" class="text-cyan-300 font-bold">Portal PJ</a></div></nav><main class="max-w-5xl mx-auto px-5 py-12"><section class="mb-10"><span class="text-cyan-300 font-black">COBRANÇA SIMPLES</span><h1 class="text-4xl md:text-6xl font-black mt-3">Digite o valor.<br>Receba o QR Code.</h1><p class="text-slate-400 text-lg mt-4">Página otimizada para computador e celular. A empresa entra com sua conta Nexa PJ, informa o valor em reais e gera a cobrança.</p></section><section id="login" class="glass rounded-3xl p-7 max-w-xl"><h2 class="text-2xl font-black mb-4">Entrar</h2><input id="email" class="w-full p-4 rounded-xl mb-3" type="email" placeholder="E-mail"><input id="password" class="w-full p-4 rounded-xl mb-4" type="password" placeholder="Senha"><button onclick="login()" class="w-full bg-indigo-500 p-4 rounded-xl font-black">Entrar no Checkout</button><p id="loginMsg" class="text-sm text-slate-400 mt-4"></p></section><section id="app" class="hidden grid lg:grid-cols-2 gap-6"><div class="glass rounded-3xl p-7"><h2 class="text-2xl font-black mb-4">Nova cobrança</h2><label class="text-sm text-slate-400">Valor da venda</label><input id="amount" class="w-full p-4 rounded-xl mt-2 mb-3 text-2xl font-black" inputmode="decimal" placeholder="R$ 0,00"><input id="description" class="w-full p-4 rounded-xl mb-3" placeholder="Descrição opcional"><select id="settlement" class="w-full p-4 rounded-xl mb-4"><option value="USDC">Receber em USDC</option><option value="BRL_PIX">Receber em Pix</option></select><button onclick="generate()" class="w-full bg-emerald-500 p-4 rounded-xl font-black">Gerar QR Code</button><button onclick="logout()" class="w-full mt-3 bg-white/10 p-3 rounded-xl">Sair</button><pre id="status" class="text-xs text-slate-400 mt-4 whitespace-pre-wrap"></pre></div><div id="result" class="glass rounded-3xl p-7 hidden"><h2 class="text-2xl font-black">Cobrança pronta</h2><div id="qr" class="bg-white rounded-2xl p-4 inline-block mt-5"></div><textarea id="copy" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 mt-4 h-28 text-xs" readonly></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('copy').value)" class="w-full mt-3 bg-cyan-500 p-3 rounded-xl font-black">Copiar Pix</button><div id="summary" class="mt-5 text-sm text-slate-300"></div></div></section></main><script>const API='https://nexa-backend-p2u0.onrender.com/api/v1';let token=localStorage.getItem('nexa_token')||'';const $=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||'Erro na operação');return d}function openApp(){if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden')}}async function login(){try{const d=await req('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.accessToken||d.token||d.data?.accessToken||'';if(!token)throw new Error('Token não retornado');localStorage.setItem('nexa_token',token);openApp()}catch(e){$('loginMsg').textContent=e.message}}function logout(){localStorage.removeItem('nexa_token');location.reload()}async function generate(){try{$('status').textContent='Gerando cobrança...';const amountBrl=Number(String($('amount').value).replace('.','').replace(',','.'));if(!amountBrl||amountBrl<1)throw new Error('Informe um valor válido');const rateData=await req('/wallet/exchange-rate');const rate=Number(rateData.buyRate||rateData.baseRate||5.25);const quote=await req('/direct-settlement/checkout/quote',{method:'POST',body:JSON.stringify({amountBrl,executableRate:rate,settlementCurrency:$('settlement').value})});const qrData=await req('/merchant/qrcode',{method:'POST',body:JSON.stringify({amount:quote.payer.amountUsdc,description:$('description').value||'Cobrança Nexa Checkout'})});const code=qrData.copyPasteCode||qrData.pixCopyPasteCode||'';$('copy').value=code;$('qr').innerHTML='';new QRCode($('qr'),{text:code,width:220,height:220});$('result').classList.remove('hidden');$('summary').innerHTML=`<b>Venda:</b> R$ ${amountBrl.toLocaleString('pt-BR',{minimumFractionDigits:2})}<br><b>Liquidação:</b> ${quote.settlementCurrency}<br><b>Taxa Nexa:</b> R$ ${quote.fees.serviceFeeBrl.toLocaleString('pt-BR',{minimumFractionDigits:2})}<br><b>Líquido estimado:</b> R$ ${quote.merchant.netBrl.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;$('status').textContent='Cobrança gerada com sucesso.'}catch(e){$('status').textContent=e.message}}openApp();</script></body></html>
